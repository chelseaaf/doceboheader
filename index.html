<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docebo Gradient Header</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .gradient-header {
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #921835, #003074, #03aee6, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="gradient-header"></div>
</body>
</html>
